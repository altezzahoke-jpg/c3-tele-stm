name: Compile ESP32-C3 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install Required Libraries
        run: |
          arduino-cli lib install "ESPAsyncWebServer"
          arduino-cli lib install "ArduinoJson"

      - name: Compile Sketch (.bin)
        run: |
          mkdir -p build_output
          arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=default,DebugLevel=none --output-dir build_output .

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32C3-Telemetry-Firmware
          path: build_output/*.bin
